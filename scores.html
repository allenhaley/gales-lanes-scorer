<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gale's Lanes — Your Scores</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #111111; color: #F5F2E9; min-height: 100vh; padding: 0 0 40px; }

  header { background: #1a1a1a; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
  .header-logo { font-family: 'Oswald', sans-serif; font-size: 20px; letter-spacing: 2px; color: #C8A44D; text-transform: uppercase; text-decoration: none; }
  .header-sub { font-size: 11px; color: #4a4741; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

  .container { max-width: 480px; margin: 0 auto; padding: 24px 20px; }

  .session-info { margin-bottom: 24px; }
  .session-title { font-family: 'Oswald', sans-serif; font-size: 26px; letter-spacing: 2px; color: #F5F2E9; text-transform: uppercase; }
  .session-meta { font-size: 13px; color: #4a4741; margin-top: 4px; letter-spacing: 0.5px; }

  .game-section { margin-bottom: 24px; }
  .game-label { font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 2px; color: #B23A2F; text-transform: uppercase; margin-bottom: 8px; }

  .player-card { background: #1a1a1a; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .player-card.top { border-color: rgba(200,164,77,0.4); background: #1f1d17; }
  .player-info { display: flex; align-items: center; gap: 10px; }
  .player-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .player-name { font-size: 15px; font-weight: 500; }
  .player-rank { font-size: 11px; color: #C8A44D; letter-spacing: 0.5px; margin-top: 2px; }
  .player-score { font-family: 'Oswald', sans-serif; font-size: 28px; letter-spacing: 1px; color: #F5F2E9; }
  .player-score.top { color: #C8A44D; }

  .total-section { background: #1a1a1a; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; margin-bottom: 28px; }
  .total-header { background: #222; padding: 10px 16px; font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 2px; color: #8a8479; text-transform: uppercase; }
  .total-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .total-row:last-child { border-bottom: none; }
  .total-row.first { background: rgba(200,164,77,0.05); }
  .total-name { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; }
  .total-games { font-size: 11px; color: #4a4741; margin-top: 2px; }
  .total-score { font-family: 'Oswald', sans-serif; font-size: 26px; }
  .total-score.gold { color: #C8A44D; }

  .trophy { font-size: 16px; margin-right: 2px; }

  .footer-links { display: flex; gap: 10px; flex-wrap: wrap; }
  .footer-link { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #8a8479; text-decoration: none; padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); transition: color 0.15s; }
  .footer-link:hover { color: #F5F2E9; }
  .footer-link.gold { color: #C8A44D; border-color: rgba(200,164,77,0.3); }

  .error { text-align: center; padding: 60px 20px; color: #4a4741; }
  .error h2 { font-family: 'Oswald', sans-serif; font-size: 22px; color: #8a8479; margin-bottom: 8px; }
</style>
</head>
<body>

<header>
  <div>
    <a class="header-logo" href="https://www.galeslanes.com">Gale's Lanes</a>
    <div class="header-sub">Bowl &amp; Bar</div>
  </div>
</header>

<div class="container" id="content">
  <div class="error"><h2>Loading scores...</h2></div>
</div>

<script>
function displayBall(val, fi, bi, allBalls) {
  const isLast = fi === 9;
  if (!isLast) {
    if (bi === 0 && val === 10) return { text: 'X', color: '#B23A2F' };
    if (bi === 1 && allBalls[0] + val === 10) return { text: '/', color: '#C8A44D' };
    if (val === 0) return { text: '–', color: '#4a4741' };
    return { text: String(val), color: '#8a8479' };
  } else {
    const [a, b] = allBalls;
    if (bi === 0) return val === 10 ? { text: 'X', color: '#B23A2F' } : { text: String(val), color: '#8a8479' };
    if (bi === 1) {
      if (val === 10) return { text: 'X', color: '#B23A2F' };
      if (a !== 10 && a + val === 10) return { text: '/', color: '#C8A44D' };
      return val === 0 ? { text: '–', color: '#4a4741' } : { text: String(val), color: '#8a8479' };
    }
    if (bi === 2) {
      if (val === 10) return { text: 'X', color: '#B23A2F' };
      if (a === 10 && b !== 10 && b + val === 10) return { text: '/', color: '#C8A44D' };
      return val === 0 ? { text: '–', color: '#4a4741' } : { text: String(val), color: '#8a8479' };
    }
  }
  return { text: String(val), color: '#8a8479' };
}

try {
  const hash = window.location.hash.slice(1);
  if (!hash) throw new Error('No data');
  const data = JSON.parse(decodeURIComponent(atob(hash)));

  const sorted = [...data.players].sort((a, b) => b.total - a.total);
  const maxTotal = sorted[0]?.total || 0;

  let html = `
    <div class="session-info">
      <div class="session-title">Your Score Card</div>
      <div class="session-meta">${data.date}${data.lane ? '  ·  Lane ' + data.lane : ''}  ·  Gale's Lanes Bowl &amp; Bar</div>
    </div>

    <div class="total-section">
      <div class="total-header">Final Standings — 3 Game Total</div>
      ${sorted.map((p, i) => `
        <div class="total-row ${i === 0 ? 'first' : ''}">
          <div class="total-name">
            <div class="player-dot" style="background:${p.color}"></div>
            <div>
              <div>${i === 0 ? '<span class="trophy">🏆</span>' : (i + 1) + '. '}${p.name}</div>
              <div class="total-games">${p.games.join(' · ')}</div>
            </div>
          </div>
          <div class="total-score ${i === 0 ? 'gold' : ''}">${p.total}</div>
        </div>
      `).join('')}
    </div>

    <div style="margin-bottom:28px;">
      ${[0,1,2].map(gi => {
        const gamePlayers = data.players.filter(p => p.games[gi] > 0);
        if (gamePlayers.length === 0) return '';
        const sorted = [...data.players].sort((a,b) => b.games[gi]-a.games[gi]);
        return `
          <div class="game-section">
            <div class="game-label">Game ${gi + 1}</div>
            ${sorted.map((p, i) => `
              <div class="player-card ${i === 0 ? 'top' : ''}">
                <div class="player-info">
                  <div class="player-dot" style="background:${p.color}"></div>
                  <div>
                    <div class="player-name">${p.name}</div>
                    ${i === 0 ? '<div class="player-rank">⭐ Game Winner</div>' : ''}
                  </div>
                </div>
                <div class="player-score ${i === 0 ? 'top' : ''}">${p.games[gi]}</div>
              </div>
            `).join('')}
          </div>
        `;
      }).join('')}
    </div>

    <div class="footer-links">
      <a class="footer-link gold" href="https://g.page/r/CWXtuifBv6fBEBM/review" target="_blank" rel="noopener">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Leave a Review
      </a>
      <a class="footer-link" href="https://www.galeslanes.com/eat-drink" target="_blank" rel="noopener">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
        View Menu
      </a>
      <a class="footer-link" href="https://www.galeslanes.com" target="_blank" rel="noopener">
        galeslanes.com
      </a>
    </div>
  `;

  document.getElementById('content').innerHTML = html;
} catch(e) {
  document.getElementById('content').innerHTML = `
    <div class="error">
      <h2>Score card not found</h2>
      <p>This link may have expired or been entered incorrectly.</p>
    </div>`;
}
</script>
</body>
</html>
